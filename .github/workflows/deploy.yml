name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Pages uses GitHub Actions source
        run: |
          echo "=== Pages config saat ini ==="
          gh api repos/${{ github.repository }}/pages \
            --jq '{build_type: .build_type, source: .source}' 2>&1 || echo "(Pages belum diaktifkan)"

          echo "=== Set build_type ke workflow ==="
          echo '{"build_type":"workflow"}' | \
          gh api repos/${{ github.repository }}/pages \
            --method PUT --input - \
            --jq '{build_type: .build_type}' 2>&1 \
          || \
          echo '{"build_type":"workflow"}' | \
          gh api repos/${{ github.repository }}/pages \
            --method POST --input - \
            --jq '{build_type: .build_type}' 2>&1 \
          || echo "Gagal update — lanjutkan saja"

          echo "=== Pages config setelah update ==="
          gh api repos/${{ github.repository }}/pages \
            --jq '{build_type: .build_type, source: .source}' 2>&1 || true

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
